# Builds the self-host image from this fork and publishes it to GHCR as
# ghcr.io/<owner>/executor-selfhost. Dokploy then pulls the finished image
# (deploy/dokploy/compose.yaml), so the server never compiles Rust, Go or the dashboard.
name: Self-host image

on:
  push:
    branches: [v2]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build per ref at a time; a newer push waits instead of cancelling a push in progress.
concurrency:
  group: self-host-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # amd64 only. For arm64 servers, add a matrix entry on ubuntu-24.04-arm and merge the
    # digests into one manifest; QEMU emulation of the Rust and Go stages is far too slow.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/executor-selfhost
    steps:
      # The build stages (Bun workspace, Rust collector, Go host) need more disk than the
      # runner leaves free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hosted/self-host/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No PostHog build args, so the image sends no product analytics.
          build-args: |
            EXECUTOR_BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: set the repository secret DOKPLOY_DEPLOY_WEBHOOK to the compose service's
      # deploy webhook URL (Dokploy, Deployments tab) to redeploy once the image is pushed.
      - name: Redeploy on Dokploy
        if: github.ref == 'refs/heads/v2'
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; skipping the redeploy."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
