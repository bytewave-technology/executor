# Builds the self-host image from this fork and publishes it to GHCR as
# ghcr.io/<owner>/executor-selfhost, for linux/amd64 and linux/arm64. Dokploy then pulls the
# finished image (deploy/dokploy/compose.yaml), so the server never compiles Rust, Go or the
# dashboard.
#
# Each architecture builds on a native runner (QEMU emulation of the Rust and Go stages is far
# too slow) and pushes by digest; the merge job then publishes one multi-arch manifest per tag.
name: Self-host image

on:
  push:
    branches: [v2]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build per ref at a time; a newer push waits instead of cancelling a push in progress.
concurrency:
  group: self-host-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/executor-selfhost

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      # The build stages (Bun workspace, Rust collector, Go host) need more disk than the
      # runner leaves free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hosted/self-host/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No PostHog build args, so the image sends no product analytics.
          build-args: |
            EXECUTOR_BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=self-host-${{ matrix.arch }}
          cache-to: type=gha,scope=self-host-${{ matrix.arch }},mode=max

      - name: Save digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Publish the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # Optional: set the repository secret DOKPLOY_DEPLOY_WEBHOOK to the compose service's
      # deploy webhook URL (Dokploy, Deployments tab) to redeploy once the image is pushed.
      - name: Redeploy on Dokploy
        if: github.ref == 'refs/heads/v2'
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; skipping the redeploy."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DOKPLOY_DEPLOY_WEBHOOK"
