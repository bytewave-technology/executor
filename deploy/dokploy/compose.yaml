# Executor self-host on Dokploy. Create a Compose service from this repository with this
# path, set the variables below in its Environment tab, and add the domain on port 4400.
# The image comes from .github/workflows/self-host-image.yml; nothing is built on the server.
services:
  executor:
    image: ${EXECUTOR_IMAGE:-ghcr.io/bytewave-technology/executor-selfhost:latest}
    # The image has no init process of its own; the upstream guide runs it with --init.
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # Exact public origin, with https:// and no trailing slash.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      # At least 32 characters. Never change it after the first start.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      # Exactly 64 hexadecimal characters. Saved accounts cannot be read without it.
      EXECUTOR_ENCRYPTION_KEY: ${EXECUTOR_ENCRYPTION_KEY:?Set EXECUTOR_ENCRYPTION_KEY}
      # Optional: the Traefik container's address on dokploy-network, so rate limits see
      # the client's address instead of the proxy's.
      EXECUTOR_TRUSTED_PROXIES: ${EXECUTOR_TRUSTED_PROXIES:-}
      # Optional: true restarts the container when the server stops answering.
      EXECUTOR_HOST_STALL_RESTART: ${EXECUTOR_HOST_STALL_RESTART:-}
    volumes:
      - executor-data:/app/data
      - executor-telemetry:/app/motel-data

volumes:
  executor-data:
  executor-telemetry:
